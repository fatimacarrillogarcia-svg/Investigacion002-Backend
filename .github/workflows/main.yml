name: Build, publish and deploy to MonsterASP.NET
on: [push]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --runtime win-x86

      - name: Setup .NET 6 (required by test projects targeting net6.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Test with .NET
        run: dotnet test

      - name: Normalize WebDeploy server URL
        id: normalize_webdeploy
        shell: pwsh
        run: |
          $server = "${{ secrets.SERVER_COMPUTER_NAME }}".Trim()
          $server = $server -replace '/?msdeploy\.axd(\?site=.*)?$', ''
          $server = $server.TrimEnd('/')
          "server-computer-name=$server" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ steps.normalize_webdeploy.outputs.server-computer-name }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
