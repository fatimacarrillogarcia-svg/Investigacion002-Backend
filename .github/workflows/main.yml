name: Build, publish and deploy to MonsterASP.NET
on: [push]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --runtime win-x86

      - name: Setup .NET 6 (required by test projects targeting net6.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Test with .NET
        run: dotnet test

      - name: Install WebDeploy
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            throw "WebDeploy not found at $msdeploy"
          }

      - name: Deploy to MonsterASP.NET via WebDeploy
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE "publish"
          $destinationUrl = "https://${{ secrets.SERVER_COMPUTER_NAME }}:8172/msdeploy.axd?site=${{ secrets.WEBSITE_NAME }}"

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$sourcePath" `
            -dest:contentPath="${{ secrets.WEBSITE_NAME }}",computerName="$destinationUrl",userName="${{ secrets.SERVER_USERNAME }}",password="${{ secrets.SERVER_PASSWORD }}",authtype="Basic",includeAcls="False" `
            -allowUntrusted `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension `
            -verbose
